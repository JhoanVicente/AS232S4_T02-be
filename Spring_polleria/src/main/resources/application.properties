spring.datasource.url=jdbc:oracle:thin:@dblospinos_high?TNS_ADMIN=C:/Users/Pc/Downloads/IMPORTANTE_ESTA_ES_SI_SI_SI/AS231S3_T05-be-backend/WALLET

# Usuario y contraseña del servicio en Oracle Cloud
spring.datasource.username=jhoan
